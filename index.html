<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a44">
<title>Lostalien Wallpapers</title>
<style>
  :root {
    --bg: #0f3a44; --text: #e3f6f2; --accent: #5fd0b8;
    --sky: linear-gradient(#35a6f0, #1d7ad8 45%, #1650b2);
    --glass: color-mix(in srgb, var(--bg) 62%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background-color: var(--bg); background-image: var(--sky); background-size: cover; color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-text-size-adjust: 100%;
  }
  #wall { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  .ui { position: fixed; z-index: 1; left: 16px; right: 16px; }
  header { top: max(16px, env(safe-area-inset-top)); max-width: 34rem; }
  .card {
    display: inline-block; padding: 12px 16px; border-radius: 14px;
    background: var(--glass); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  #name { margin: 0; font-size: 20px; font-weight: 700; }
  #greet { margin: 2px 0 0; font-size: 14px; }
  #tagline { margin: 6px 0 0; font-size: 12px; opacity: .8; line-height: 1.4; }
  .dock { bottom: 0; left: 0; right: 0; padding: 0 16px max(14px, env(safe-area-inset-bottom)); }
  .controls { display: inline-flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; padding: 6px 12px; border-radius: 12px; font-size: 12px; background: var(--glass); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .controls label { display: flex; gap: 8px; align-items: center; }
  .controls input[type=range] { width: 110px; accent-color: var(--accent); }
  .controls select { font: inherit; color: var(--text); background: var(--glass); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; }
  #picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #picker::-webkit-scrollbar { display: none; }
  #picker button {
    flex: 0 0 auto; font: inherit; font-size: 13px; color: var(--text); background: var(--glass);
    border: 1px solid color-mix(in srgb, var(--chip) 60%, transparent); border-radius: 999px;
    padding: 10px 16px; min-height: 44px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #picker button[aria-pressed="true"] { background: var(--chip); color: #0b0b0b; border-color: var(--chip); font-weight: 700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .credit { margin: 8px 0 0; font-size: 10px; opacity: .85; text-shadow: 0 0 4px var(--bg); }
  .credit a { color: inherit; }
</style>
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>

<header class="ui">
  <div class="card">
    <h1>👽 Lostalien</h1>
    <p id="name"></p>
    <p id="greet"></p>
    <p id="tagline"></p>
  </div>
</header>

<div class="ui dock">
  <div class="controls">
    <label>Speed <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" aria-label="Animation speed"></label>
    <label>Cell
      <select id="cell" aria-label="Character size">
        <option value="">Auto</option>
        <option value="14">Small</option>
        <option value="18">Medium</option>
        <option value="22">Large</option>
      </select>
    </label>
  </div>
  <nav id="picker" aria-label="Wallpaper"></nav>
  <p class="credit">Live ASCII scenes by <a href="https://github.com/0toshigami/claude-desktop-themes">0toshigami/claude-desktop-themes</a> (MIT)</p>
</div>

<script src="wallpapers.js"></script>
</body>
</html>
