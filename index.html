<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04161c">
<title>Lostalien Themes</title>
<style>
  :root {
    --bg: #04161c; --fg: #38e8d0; --dim: #137a80; --accent: #b8fff4;
    --panel: rgba(2, 16, 22, .72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; transition: background .4s, color .4s; }
  #wall {
    position: fixed; inset: 0; margin: 0; padding: 0;
    font-size: 12px; line-height: 12px; letter-spacing: 0;
    white-space: pre; overflow: hidden; user-select: none;
    color: var(--fg);
  }
  header {
    position: fixed; left: 16px; right: 16px; top: max(16px, env(safe-area-inset-top));
    pointer-events: none;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 8px var(--bg), 0 0 2px var(--bg); }
  h1 small { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--fg); opacity: .85; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px max(14px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(to top, var(--panel), transparent);
  }
  button {
    flex: 0 0 auto; font: inherit; font-size: 13px; color: var(--fg);
    background: var(--panel); border: 1px solid var(--dim); border-radius: 999px;
    padding: 10px 16px; min-height: 44px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<pre id="wall" aria-hidden="true"></pre>
<header>
  <h1>👽 Lostalien<small id="sub"></small></h1>
</header>
<nav id="picker" aria-label="Theme"></nav>

<script>
"use strict";
// Each theme: colors, a character ramp (dark -> bright) and a field(x, y, t) -> 0..1.
// Add a theme by adding one object here.
const THEMES = [
  {
    id: "lagoon", name: "Liquid Lagoon", sub: "warm water, slow light",
    bg: "#04161c", fg: "#38e8d0", dim: "#137a80", accent: "#b8fff4",
    ramp: " .,:~≈≋=+*#",
    field: (x, y, t) => {
      const w = Math.sin(x * .09 + t * .9) + Math.sin(y * .22 - t * .7 + x * .04) +
                Math.sin((x + y) * .06 + t * .5) + Math.sin(Math.hypot(x - 60, y - 20) * .12 - t * 1.1);
      return (w + 4) / 8;
    }
  },
  {
    id: "alien", name: "Alien Signal", sub: "are you following me?",
    bg: "#020a03", fg: "#3dff6a", dim: "#12712a", accent: "#caffd6",
    ramp: " .·:+x%@",
    field: (x, y, t) => {
      const col = Math.sin(x * 12.9898) * 43758.5453; // per-column pseudo-random
      const speed = .35 + (col - Math.floor(col)) * .9;
      const head = (t * speed * 14 + (col * 97 % 40)) % 48;
      const d = ((y - head) % 48 + 48) % 48;
      return d < 14 ? 1 - d / 14 : 0;
    }
  },
  {
    id: "reef", name: "Neon Reef", sub: "coral after midnight",
    bg: "#16061f", fg: "#ff5fd2", dim: "#7a2a8f", accent: "#ffd1f3",
    ramp: " ·o*O0@#",
    field: (x, y, t) => {
      const a = Math.sin(x * .13 + Math.sin(y * .17 + t * .6) * 2 + t * .4);
      const b = Math.cos(y * .19 - Math.sin(x * .11 - t * .5) * 2);
      return (a * b + 1) / 2;
    }
  },
  {
    id: "space", name: "Deep Space", sub: "lost, but comfortably",
    bg: "#02020a", fg: "#a9b8ff", dim: "#3b4488", accent: "#ffffff",
    ramp: " .·+*✦",
    field: (x, y, t) => {
      const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      const r = h - Math.floor(h);
      if (r > .965) return .5 + .5 * Math.sin(t * 2 + r * 60);
      const g = Math.sin(x * .05 + t * .1) * Math.sin(y * .09 - t * .08);
      return g > .8 ? .18 : 0;
    }
  },
  {
    id: "dune", name: "Sunset Dune", sub: "slow sand, long shadows",
    bg: "#1a0a05", fg: "#ff9a4d", dim: "#8a3f18", accent: "#ffe0b8",
    ramp: " .:-=+*%#",
    field: (x, y, t) => {
      const ridge = 22 + Math.sin(x * .05 + t * .2) * 5 + Math.sin(x * .13 - t * .15) * 2;
      const d = y - ridge;
      const ripple = Math.sin((x + d * 2) * .35 + t * .6) * .15;
      return d > 0 ? Math.min(1, d / 18 + .25 + ripple) : Math.max(0, .12 + d / 80 + ripple * .3);
    }
  }
];

const wall = document.getElementById("wall");
const picker = document.getElementById("picker");
const sub = document.getElementById("sub");
const root = document.documentElement;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let theme = THEMES[0], cols = 0, rows = 0, cw = 7.2, raf = 0, last = 0, t0 = performance.now();

function measure() {
  // Measure one monospace cell so the grid exactly fills the screen.
  const probe = document.createElement("span");
  probe.textContent = "M".repeat(50);
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  wall.appendChild(probe);
  cw = probe.getBoundingClientRect().width / 50 || 7.2;
  wall.removeChild(probe);
  cols = Math.ceil(innerWidth / cw) + 1;
  rows = Math.ceil(innerHeight / 12) + 1;
}

function draw(now) {
  const t = (now - t0) / 1000;
  const ramp = theme.ramp, n = ramp.length - 1, f = theme.field;
  let out = "";
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const v = f(x, y, t);
      out += ramp[Math.max(0, Math.min(n, Math.round(v * n)))];
    }
    out += "\n";
  }
  wall.textContent = out;
}

function loop(now) {
  if (now - last > 66) { last = now; draw(now); } // ~15 fps keeps phones cool
  raf = requestAnimationFrame(loop);
}

function apply(next) {
  theme = next;
  root.style.setProperty("--bg", next.bg);
  root.style.setProperty("--fg", next.fg);
  root.style.setProperty("--dim", next.dim);
  root.style.setProperty("--accent", next.accent);
  document.querySelector('meta[name="theme-color"]').content = next.bg;
  sub.textContent = next.name + " — " + next.sub;
  picker.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === next.id)));
  try { localStorage.setItem("lostalien-theme", next.id); } catch (e) {}
  draw(performance.now());
}

THEMES.forEach(th => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.id = th.id; b.textContent = th.name;
  b.addEventListener("click", () => apply(th));
  picker.appendChild(b);
});

let saved = null;
try { saved = localStorage.getItem("lostalien-theme"); } catch (e) {}
measure();
apply(THEMES.find(x => x.id === saved) || THEMES[0]);
if (!reduced) raf = requestAnimationFrame(loop);

addEventListener("resize", () => { measure(); draw(performance.now()); });
document.addEventListener("visibilitychange", () => {
  cancelAnimationFrame(raf);
  if (!document.hidden && !reduced) raf = requestAnimationFrame(loop);
});
</script>
</body>
</html>
